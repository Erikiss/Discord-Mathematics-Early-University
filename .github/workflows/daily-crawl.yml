name: Daily Math Crawl

# Läuft täglich per Zeitplan und lädt die vier Ziel-Kanäle ausschließlich
# clientseitig verschlüsselt als Workflow-Artefakt hoch. Der Discord-Token kommt
# aus dem Repository-Secret DISCORD_TOKEN_Backupper123; der öffentliche
# age-Empfänger aus der Repository-Variable DISCORD_EXPORT_AGE_RECIPIENT.
#
# WICHTIG:
#  * Der 'schedule'-Trigger feuert nur auf dem Standard-Branch (main) - erst nach
#    dem Merge dieses Branches läuft der Cron automatisch.
#  * GitHub deaktiviert geplante Workflows nach 60 Tagen ohne Repo-Aktivität.
#  * Das Artefakt enthält fremde Discord-Nachrichten. In diesem öffentlichen
#    Repository darf deshalb niemals ein Klartext-Export hochgeladen werden.

on:
  schedule:
    # 03:17 UTC täglich (bewusst versetzt, nicht auf die volle Stunde).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Zeitfenster in Tagen (Standard: 3)"
        required: false
        default: "3"
      full:
        description: "Komplette Historie crawlen (ignoriert 'days')"
        type: boolean
        required: false
        default: false
      max_per_channel:
        description: "Max. Nachrichten pro Kanal"
        required: false
        default: "5000"

# Nur Lesezugriff nötig - wir committen nichts zurück.
permissions:
  contents: read

# Keine überlappenden Läufe.
concurrency:
  group: daily-math-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          # Token aus dem Repo-Secret -> Umgebungsvariable, die das Skript liest.
          DISCORD_TOKEN_Backupper123: ${{ secrets.DISCORD_TOKEN_Backupper123 }}
          # Inputs bewusst über Env (nicht inline ${{ }}) gegen Shell-Injection.
          IN_DAYS: ${{ inputs.days }}
          IN_FULL: ${{ inputs.full }}
          IN_MAX: ${{ inputs.max_per_channel }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_TOKEN_Backupper123:-}" ]; then
            echo "::error::Secret 'DISCORD_TOKEN_Backupper123' fehlt. Anlegen unter Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          ARGS=(--max "${IN_MAX:-5000}")
          if [ "${IN_FULL:-false}" = "true" ]; then
            ARGS+=(--full)
          else
            ARGS+=(--days "${IN_DAYS:-3}")
          fi
          mkdir -p discord_exports
          if ! python discord_math_crawl.py "${ARGS[@]}" \
            > discord_exports/crawl.log 2>&1; then
            echo "::error::Discord-Crawl fehlgeschlagen; Details stehen nur im verschlüsselten Export."
            exit 1
          fi

      # Merge aller Kanal-JSONs -> MATH_MERGED.json, plus Link-/Ressourcen-CSV.
      # Läuft auch, wenn der Crawl teilweise fehlschlug, damit vorhandene Daten
      # trotzdem aufbereitet werden.
      - name: Merge + Ressourcen-CSV erzeugen
        if: always()
        run: |
          mkdir -p discord_exports
          if ! python extract_resources.py \
            > discord_exports/extract-resources.log 2>&1; then
            echo "::error::Ressourcen-Extraktion fehlgeschlagen; Details stehen nur im verschlüsselten Export."
            exit 1
          fi

      # Kerninhalt dieser vier Kanäle: diskutierte Gleichungen (LaTeX, vom TeXit-Bot
      # gerendert) statt Paper-Links -> math_discussions.json/.csv.
      - name: Diskutierte Probleme extrahieren
        if: always()
        env:
          # Server-IDs sind zwar keine Zugangsdaten, können den privaten
          # Quellserver aber identifizieren und werden deshalb maskiert.
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${GUILD_ID:-}" ]; then ARGS+=(--guild-id "$GUILD_ID"); fi
          if ! python extract_discussions.py "${ARGS[@]}" \
            > discord_exports/extract-discussions.log 2>&1; then
            echo "::error::Diskussions-Extraktion fehlgeschlagen; Details stehen nur im verschlüsselten Export."
            exit 1
          fi

      # Signed CDN-Links laufen ab. Deshalb werden ausschließlich allow-gelistete
      # Discord-Bildanhänge sofort als opaque lokale Dateien materialisiert.
      - name: Bildanhänge für die Triage materialisieren
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f discord_exports/ingest_bundle.json ]; then
            echo "::warning::Kein ingest_bundle.json vorhanden; Medien-Schritt wird übersprungen."
            exit 0
          fi
          if ! python materialize_media.py \
            > discord_exports/materialize-media.log 2>&1; then
            echo "::error::Medien-Materialisierung fehlgeschlagen; Details stehen nur im verschlüsselten Export."
            exit 1
          fi

      # Das Framework ist die oberste Orchestrierungsschicht. Ein optionaler Ref
      # erlaubt reproduzierbare Vertragsprüfungen gegen einen Tag oder Commit.
      - name: Agentic Researcher auschecken
        if: always()
        uses: actions/checkout@v4
        with:
          repository: Erikiss/The-Agentic-Researcher
          ref: ${{ vars.AGENTIC_RESEARCHER_REF || 'main' }}
          path: _agentic_researcher
          persist-credentials: false

      - name: Übergabevertrag prüfen
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f discord_exports/ingest_bundle.json ]; then
            echo "::warning::Kein ingest_bundle.json vorhanden; Vertragsprüfung wird übersprungen."
            exit 0
          fi
          if ! python scripts/contract_smoke.py \
              --agentic-researcher _agentic_researcher \
              --bundle discord_exports/ingest_bundle.json \
              --media-root discord_exports/curation_media \
              > discord_exports/contract-smoke.log 2>&1; then
            echo "::error::Übergabevertrag fehlgeschlagen; Details stehen nur im verschlüsselten Export."
            exit 1
          fi
          git -C _agentic_researcher rev-parse HEAD \
            > discord_exports/AGENTIC_RESEARCHER_COMMIT.txt

      - name: Datum für Artefaktnamen
        id: meta
        if: always()
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Export vor dem Upload verschlüsseln
        id: encrypt
        if: always()
        env:
          AGE_RECIPIENT: ${{ vars.DISCORD_EXPORT_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          if [ ! -d discord_exports ] || [ -z "$(find discord_exports -type f -print -quit)" ]; then
            echo "::warning::Keine Exportdateien vorhanden."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${AGE_RECIPIENT:-}" ]; then
            echo "::error::Repository-Variable DISCORD_EXPORT_AGE_RECIPIENT fehlt; Klartext-Export wird nicht hochgeladen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes age
          if ! (
            tar -czf - discord_exports \
              | age --recipient "$AGE_RECIPIENT" \
                  --output discord-math-export.tar.gz.age
          ) 2> encryption-error.log; then
            echo "::error::Export-Verschlüsselung fehlgeschlagen; es wird kein Artefakt hochgeladen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          rm -f encryption-error.log
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verschlüsselten Export als Artefakt hochladen
        if: always() && steps.encrypt.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: discord-math-export-${{ steps.meta.outputs.date }}
          path: discord-math-export.tar.gz.age
          retention-days: 30
          if-no-files-found: error
